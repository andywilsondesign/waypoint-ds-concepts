<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Waypoint Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a component library. Slim nav on the left, one component page on the right. New findings appear inside the page, in the place they would live. */
:root{
  --bg:#FBFBFA; --surface:#FFFFFF; --stage:#F2F3F1; --ink:#1A1C1E; --ink-2:#5D6268; --ink-3:#91969C; --rule:#E6E7E4;
  --new:#B26A00; --new-bg:#FBF2E2; --ok:#2C7A54; --ok-bg:#E6F3EC; --focus:#2563EB;
  --f-ui:'Schibsted Grotesk',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141516; --surface:#1B1D1F; --stage:#232527; --ink:#ECEDEE; --ink-2:#A5AAB0; --ink-3:#71767C; --rule:#2D3033;
  --new:#EFB45A; --new-bg:#3A2C14; --ok:#6CCB97; --ok-bg:#183327; --focus:#8DB0FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141516; --surface:#1B1D1F; --stage:#232527; --ink:#ECEDEE; --ink-2:#A5AAB0; --ink-3:#71767C; --rule:#2D3033;
  --new:#EFB45A; --new-bg:#3A2C14; --ok:#6CCB97; --ok-bg:#183327; --focus:#8DB0FF; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.55 var(--f-ui)}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
nav{border-right:1px solid var(--rule);padding:24px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));display:grid;gap:22px;align-content:start;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:15px}
.brand span{display:block;font-weight:400;color:var(--ink-3);font-size:13px}
.navg{display:grid;gap:2px}
.navg h4{margin:0 0 4px;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.navg button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:6px;font-size:14.5px;color:var(--ink-2)}
.navg button:hover{background:var(--stage)}
.navg button[aria-current="true"]{background:var(--stage);color:var(--ink);font-weight:600}
.navg button:focus-visible{outline:2px solid var(--focus)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--new)}
.added{font:500 10.5px var(--f-mono);color:var(--ok)}
main{padding-block:36px 80px;padding-left:max(16px,clamp(16px,4vw,56px));padding-right:max(16px,env(safe-area-inset-right,0px),clamp(16px,4vw,56px));max-width:980px;display:grid;gap:44px;min-width:0}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr)}nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule);grid-auto-flow:column;overflow-x:auto;gap:18px;padding-right:max(16px,env(safe-area-inset-right,0px))}.navg{grid-auto-flow:column;align-items:center}.navg h4{display:none}}
.eyebrow{font:500 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
h1{margin:6px 0 6px;font:700 40px/1.05 var(--f-ui);letter-spacing:-.025em}
.purpose{font-size:18px;color:var(--ink-2);margin:0 0 12px}
.status{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.status span{display:inline-flex;gap:7px;align-items:center}
.status i{width:8px;height:8px;border-radius:50%;display:inline-block}
.stage{background:var(--stage);border-radius:14px;padding:44px 24px;display:flex;gap:28px;justify-content:center;align-items:center;flex-wrap:wrap;position:relative}
.spec{position:relative;display:inline-flex}
.spec .hm{position:absolute;left:-30px;top:0;bottom:0;display:flex;align-items:center;font:500 11px var(--f-mono);color:var(--ink-3)}
.spec .hm::after{content:"";position:absolute;right:-6px;top:0;bottom:0;border-left:1px solid var(--ink-3)}
.spec .rm{position:absolute;right:-8px;top:-22px;font:500 11px var(--f-mono);color:var(--ink-3)}
h2{margin:0 0 4px;font:600 21px var(--f-ui);letter-spacing:-.01em}
.sec-sub{color:var(--ink-2);font-size:14.5px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.vcard{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:0;display:grid;text-align:left;overflow:hidden}
.vcard .v-stage{background:var(--stage);height:104px;display:grid;place-items:center}
.vcard .v-body{padding:12px 14px;display:grid;gap:2px}
.vcard b{font-weight:600}
.vcard small{color:var(--ink-2);font-size:13px}
.vcard .tag{font:500 11px var(--f-mono);color:var(--ok);margin-top:4px}
.vcard.fresh{animation:settle 1.4s ease}
@keyframes settle{0%{box-shadow:0 0 0 3px var(--ok-bg);transform:scale(.97)}60%{box-shadow:0 0 0 3px var(--ok-bg)}}
.ghost{border:1.5px dashed var(--new);background:var(--surface);cursor:pointer}
.ghost .v-stage{background:repeating-linear-gradient(135deg,var(--stage) 0 10px,var(--bg) 10px 20px)}
.ghost .ask{font:500 12px var(--f-mono);color:var(--new)}
.ghost:hover{background:var(--new-bg)}
.ghost[aria-expanded="true"]{background:var(--new-bg)}
.review{grid-column:1/-1;border:1.5px solid var(--new);border-radius:14px;background:var(--surface);padding:22px;display:grid;gap:18px;animation:open .35s ease}
@keyframes open{from{opacity:0;transform:translateY(-6px)}}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.cmp{grid-template-columns:1fr}}
.cmp > div{background:var(--stage);border-radius:10px;padding:26px 12px 14px;display:grid;justify-items:center;gap:14px;position:relative;min-height:150px;align-content:center}
.cmp small{font:500 11.5px var(--f-mono);color:var(--ink-2)}
.overlay{background:var(--stage);border-radius:10px;padding:30px 12px;display:grid;place-items:center;position:relative;min-height:150px}
.overlay .o1,.overlay .o2{grid-area:1/1}
.overlay .o2 .pbtn{background:transparent!important;color:transparent!important;outline:2px solid var(--new);outline-offset:-1px}
.diff{font-size:16px}
.diff b{font-weight:600}
.diff span{color:var(--ink-2)}
.ctx{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.mini{width:150px;border-radius:8px;background:#fff;border:1px solid #DDE1E5;padding:9px;display:grid;gap:5px}
.mini .ln{height:5px;border-radius:3px;background:#E4E7EB}
.mini .f{height:14px;border:1px solid #CFD5DB;border-radius:3px}
.ctx p{margin:0;font-size:14px;color:var(--ink-2);max-width:40ch}
.q{font:600 20px var(--f-ui);letter-spacing:-.01em;margin:0}
.read{font-size:14px;color:var(--ink-2)}
.read b{color:var(--ink);font-weight:500}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;text-align:left;display:grid;gap:1px;flex:1 1 190px}
.opt:hover{border-color:var(--ink-2)}
.opt b{font-weight:600;font-size:14.5px}
.opt span{font-size:13px;color:var(--ink-2)}
.opt.sug{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.sug b::after{content:"  suggested";font:500 10.5px var(--f-mono);color:var(--ink-3)}
.opt.cur{background:var(--ok-bg);border-color:var(--ok)}
.linkish{all:unset;cursor:pointer;color:var(--ink-2);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.linkish:focus-visible{outline:2px solid var(--focus)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.notes{display:grid;gap:10px}
.note{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 16px}
.note .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:14px}
.note.pending .ic{background:var(--new-bg);color:var(--new)}
.note.context .ic{background:var(--ok-bg);color:var(--ok)}
.note b{font-weight:600}
.note p{margin:2px 0 0;font-size:14px;color:var(--ink-2)}
.note .grow{flex:1}
.props{display:grid;gap:0;border-top:1px solid var(--rule)}
.props div{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.props span:first-child{color:var(--ink-2)}
.props .chg{color:var(--ok);font:500 11.5px var(--f-mono);margin-left:8px}
.usage{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.usage{grid-template-columns:1fr}}
.usage div{border-radius:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--rule)}
.usage h3{margin:0 0 6px;font:500 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.usage ul{margin:0;padding-left:18px;font-size:14.5px;display:grid;gap:3px}
.usage .new{color:var(--ok)}
.reasons{display:grid;gap:0;border-left:2px solid var(--rule);padding-left:18px}
.reason{padding:6px 0 16px;position:relative}
.reason::before{content:"";position:absolute;left:-24px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--ink-3)}
.reason.mine::before{border-color:var(--ok);background:var(--ok)}
.reason .when{font:500 11.5px var(--f-mono);color:var(--ink-3)}
.reason p{margin:2px 0 4px}
.reason .ch{font-size:13px;color:var(--ink-2)}
.where{display:flex;gap:10px;flex-wrap:wrap}
.where span{background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:5px 12px;font-size:14px}
.where em{font-style:normal;color:var(--ink-3);font-size:12.5px;margin-left:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;font-size:14px;transition:.3s;z-index:9;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast:not(.show){visibility:hidden;transition:.3s,visibility 0s .3s}
.toast button{background:none;border:1px solid currentColor;border-radius:6px;padding:3px 10px;font-size:13px;color:inherit}
.simple{display:grid;gap:16px}
.sw{display:flex;gap:12px;flex-wrap:wrap}
.sw div{width:150px;border-radius:12px;overflow:hidden;border:1px solid var(--rule);background:var(--surface)}
.sw i{display:block;height:70px}
.sw span{display:block;padding:8px 10px;font-size:13.5px}
@media (prefers-reduced-motion: reduce){.vcard.fresh,.review,.toast{animation:none;transition:none}}
</style>

<div class="app">
  <nav id="nav" aria-label="Library"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"><span id="tmsg"></span><button id="tundo">Undo</button></div>

<script>
// Shared scenario: one established component, two findings. Each prototype renders this differently.
const BLUE='#2563EB', BLUE_HOVER='#1D4FD7';
const BASE={name:'Primary action',purpose:'Completes the main task on a screen.',h:40,r:6,examples:['Continue','Save changes'],screens:88,
  status:'Approved · shipped',since:'Approved March 2024'};

const FINDINGS={
  checkout:{id:'checkout',where:'Checkout',screen:'Payment step',screens:12,label:'Pay £412',h:40,r:4,prop:'radius',
    diff:'Corners are 4px, not 6px.',same:'Colour, label and height match.',
    q:'Is this the same Primary action?',
    guess:'align',guessWhy:'Checkout was built before corners moved to 6px in the 2024 refresh. Probably left behind.'},
  search:{id:'search',where:'Search',screen:'Search bar',screens:6,label:'Search',h:48,r:6,prop:'height',
    diff:'48px tall, not 40px.',same:'Colour, label and corners match.',
    q:'Is this a size of Primary action?',
    guess:'variant',guessWhy:'It sits beside a 48px search field, so the extra height looks deliberate.'},
};
const ORDER=['checkout','search'];

// Outcomes in designer language. "alt" outcomes only appear when the designer disagrees with the suggestion.
const OUT={
  checkout:{
    align:{label:'Bring it back in line',sub:'Same component. Checkout should use 6px.',
      result:'Checkout should use the standard 6px corners.',ship:'Not shipped yet · 12 Checkout screens still use 4px',pending:true,
      why:'Checkout predates the 6px corner change. Treated as drift to fix.'},
    variant:{label:'Keep it as a variant',sub:'A named variant with 4px corners.',
      result:'Adds a “Compact corners” variant with 4px corners.',ship:'Matches what’s shipped',
      why:'A 4px-corner variant is allowed where denser UI needs it.'},
    context:{label:'It’s Checkout’s style, on purpose',sub:'Checkout uses 4px corners everywhere.',alt:true,
      result:'Checkout keeps 4px corners as a deliberate exception.',ship:'Matches what’s shipped',
      why:'All of Checkout uses 4px corners to match the payment provider’s forms. Kept on purpose.'},
    separate:{label:'It’s a different component',sub:'Paying is its own job.',alt:true,
      result:'Creates “Payment action” as its own component.',ship:'Matches what’s shipped',
      why:'Taking payment carries different rules from a normal primary action.'},
    unsure:{label:'Not sure yet',sub:'Leave it open. Nothing changes.',
      result:'Left open. Nothing changes.',ship:'',open:true,why:''},
  },
  search:{
    variant:{label:'Add it as a size',sub:'Primary action gets a Large size (48px).',
      result:'Adds Size = Large (48px) to Primary action.',ship:'Matches what’s shipped',
      why:'Large lines up with 48px inputs, as in the search bar.'},
    align:{label:'Bring it back in line',sub:'Search should use 40px.',
      result:'Search should use the standard 40px height.',ship:'Not shipped yet · 6 Search screens still 48px',pending:true,
      why:'Search should not differ. Treated as drift to fix.'},
    context:{label:'Only in the search bar',sub:'An adaptation, not a size anyone can pick.',alt:true,
      result:'Search bar may stretch Primary action to the field height.',ship:'Matches what’s shipped',
      why:'Height follows the search field. Not offered as a general size.'},
    unsure:{label:'Not sure yet',sub:'Leave it open. Nothing changes.',
      result:'Left open. Nothing changes.',ship:'',open:true,why:''},
  },
};

// decisions: {checkout:{k, challenged}, search:{...}}
function libraryFrom(dec){
  const L={variants:[{name:'Default',h:40,r:6,note:'Most screens',isNew:false}],contexts:[],fixes:[],components:[],open:[],reasons:[]};
  for(const id of ORDER){
    const d=dec[id];const f=FINDINGS[id];
    if(!d||OUT[id][d.k].open){L.open.push(id);continue}
    const o=OUT[id][d.k];
    if(id==='checkout'&&d.k==='variant')L.variants.push({name:'Compact corners',h:40,r:4,note:'Dense layouts',isNew:true,from:id});
    if(id==='search'&&d.k==='variant')L.variants.push({name:'Large',h:48,r:6,note:'Beside 48px inputs',isNew:true,from:id});
    if(d.k==='context')L.contexts.push({where:f.where,rule:id==='checkout'?'4px corners':'Matches field height',from:id});
    if(o.pending)L.fixes.push({where:f.where,text:o.ship,from:id});
    if(d.k==='separate')L.components.push({name:'Payment action',from:id});
    L.reasons.push({from:id,where:f.where,text:o.why,challenged:d.challenged,result:o.result});
  }
  return L;
}
function guidance(dec){
  const g={use:['For the one action that completes the task on a screen.'],avoid:['More than one per screen.','Destructive actions.']};
  if(dec.search&&dec.search.k==='variant')g.use.push('Use Large beside 48px inputs, such as search.');
  if(dec.search&&dec.search.k==='context')g.use.push('In the search bar, match the field height.');
  if(dec.checkout&&dec.checkout.k==='variant')g.use.push('Use Compact corners in dense layouts.');
  if(dec.checkout&&dec.checkout.k==='context')g.use.push('In Checkout, corners are 4px by design.');
  return g;
}
// A real-looking button specimen at any scale.
function btn(label,h=40,r=6,scale=1,extra=''){
  return `<span class="pbtn" style="height:${h*scale}px;border-radius:${r*scale}px;padding:0 ${18*scale}px;font-size:${14*scale}px;${extra}">${label}</span>`;
}
const PBTN_CSS=`.pbtn{display:inline-flex;align-items:center;justify-content:center;background:${BLUE};color:#fff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600;white-space:nowrap;line-height:1;box-sizing:border-box}`;

document.head.insertAdjacentHTML('beforeend',`<style>${PBTN_CSS}</style>`);
const S={page:'primary',dec:{},open:null,showAlt:false,overlay:false,fresh:null};

function renderNav(){
  const L=libraryFrom(S.dec);
  const item=(id,label,extra='')=>`<button data-page="${id}" aria-current="${S.page===id}"><span>${label}</span>${extra}</button>`;
  document.getElementById('nav').innerHTML=`<div class="brand">Waypoint<span>Design system</span></div>
    <div class="navg"><h4>Foundations</h4>${item('colour','Colour')}${item('type','Typography')}</div>
    <div class="navg"><h4>Components</h4>${item('primary','Primary action',L.open.length?'<i class="dot" aria-label="needs attention"></i>':'')}${item('secondary','Secondary action')}${item('field','Text field')}
    ${L.components.map(c=>item('payment',c.name,'<span class="added">new</span>')).join('')}</div>`;
  document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{S.page=b.dataset.page;S.open=null;render();window.scrollTo(0,0)});
}

function variantCards(L){
  const cards=L.variants.map(v=>`<div class="vcard ${S.fresh===v.from?'fresh':''}"><div class="v-stage">${btn(v.name==='Large'?'Search':'Continue',v.h,v.r)}</div>
    <div class="v-body"><b>${v.name}</b><small>${v.h}px · ${v.r}px corners · ${v.note}</small>${v.isNew?`<span class="tag">Added from ${FINDINGS[v.from].where} · <button class="linkish" data-review="${v.from}" style="font-size:11.5px">change</button></span>`:''}</div></div>`);
  const ghosts=L.open.map(id=>{const f=FINDINGS[id];const exp=S.open===id;
    return `<button class="vcard ghost" data-review="${id}" aria-expanded="${exp}"><div class="v-stage">${btn(f.label,f.h,f.r)}</div>
      <div class="v-body"><b>Seen in ${f.where}</b><small>${f.diff}</small><span class="ask">${S.dec[id]?'Left open by you':'Not part of the system yet'}</span></div></button>`});
  let out=cards.join('')+ghosts.join('');
  if(S.open) out+=reviewPanel(S.open);
  return out;
}

function reviewPanel(id){
  const f=FINDINGS[id],o=OUT[id],cur=S.dec[id]&&S.dec[id].k;
  const base=btn('Continue',BASE.h,BASE.r,1.6), found=btn(f.label,f.h,f.r,1.6);
  const keys=Object.keys(o).filter(k=>!o[k].alt||S.showAlt||(cur===k));
  const sorted=[f.guess,...keys.filter(k=>k!==f.guess)];
  return `<section class="review" aria-label="Review ${f.where} variation">
    <div class="row" style="justify-content:space-between"><span class="eyebrow">Seen in ${f.where} · ${f.screen}</span><button class="linkish" id="ovl">${S.overlay?'Side by side':'Overlay them'}</button></div>
    ${S.overlay?`<div class="overlay"><span class="o1">${btn('Continue',BASE.h,BASE.r,2.2)}</span><span class="o2">${btn('Continue',f.h,f.r,2.2)}</span></div>`
      :`<div class="cmp"><div>${base}<small>Primary action today</small></div><div>${found}<small>In ${f.where}</small></div></div>`}
    <div class="diff"><b>${f.diff}</b> <span>${f.same}</span></div>
    <div class="ctx"><div class="mini" aria-hidden="true"><div class="ln" style="width:60%"></div><div class="f"></div>${id==='checkout'?'<div class="f"></div>':''}${btn(f.label,f.h*.6,f.r*.6,1,'font-size:9px;padding:0 8px;outline:2px solid #F2B33D;outline-offset:2px')}</div>
      <p>Appears on ${f.screens} ${f.where} screens, always in the same place.</p></div>
    <p class="q">${f.q}</p>
    <div class="read">Assistant’s read: <b>${f.guessWhy}</b></div>
    <div class="opts">${sorted.map(k=>`<button class="opt ${k===f.guess?'sug':''} ${cur===k?'cur':''}" data-k="${k}"><b>${o[k].label}</b><span>${o[k].sub}</span></button>`).join('')}</div>
    <div class="row">${S.showAlt?'':`<button class="linkish" id="notq">Not quite. Show other readings</button>`}<button class="linkish" id="closeR">Close</button></div>
  </section>`;
}

function primaryPage(){
  const L=libraryFrom(S.dec),g=guidance(S.dec);
  const hasLarge=L.variants.some(v=>v.name==='Large'),hasCompact=L.variants.some(v=>v.r===4);
  const openN=L.open.length;
  return `<header><div class="eyebrow">Component</div><h1>${BASE.name}</h1><p class="purpose">${BASE.purpose}</p>
    <div class="status"><span><i style="background:var(--ok)"></i>Approved · shipped</span>${L.fixes.length?`<span><i style="background:var(--new)"></i>${L.fixes.length} approved change${L.fixes.length>1?'s':''} not shipped yet</span>`:''}${openN?`<span><i style="border:1.5px dashed var(--new)"></i>${openN} variation${openN>1?'s':''} seen in the product</span>`:'<span>Nothing new in the product</span>'}</div></header>
   <div class="stage"><span class="spec"><span class="hm">40</span>${btn('Continue')}<span class="rm">r6</span></span>${btn('Save changes')}${hasLarge?btn('Search',48,6):''}</div>
   <section><h2>Variants</h2><p class="sec-sub">${openN?'The product uses this button in ways the library doesn’t describe yet. Open one to decide what it is.':'Everything the product uses is described here.'}</p><div class="grid">${variantCards(L)}</div></section>
   ${L.fixes.length||L.contexts.length?`<section><h2>Exceptions and fixes</h2><p class="sec-sub">Agreed differences, and agreed changes the product hasn’t caught up with.</p><div class="notes">
     ${L.contexts.map(c=>`<div class="note context ${S.fresh===c.from?'vcard fresh':''}"><span class="ic">◆</span><div class="grow"><b>In ${c.where}: ${c.rule}</b><p>On purpose. Matches what’s shipped.</p></div><button class="linkish" data-review="${c.from}">Change</button></div>`).join('')}
     ${L.fixes.map(c=>`<div class="note pending ${S.fresh===c.from?'vcard fresh':''}"><span class="ic">↺</span><div class="grow"><b>Bring ${c.where} in line</b><p>${c.text}. The library is right; the product will follow.</p></div><button class="linkish" data-review="${c.from}">Change</button></div>`).join('')}</div></section>`:''}
   <section><h2>Properties</h2><div class="props">
     <div><span>Height</span><span>40px${hasLarge?'<span class="chg">+ 48px Large</span>':''}</span></div>
     <div><span>Corner radius</span><span>6px${hasCompact?'<span class="chg">+ 4px Compact corners</span>':''}${L.contexts.some(c=>c.from==='checkout')?'<span class="chg">4px in Checkout</span>':''}</span></div>
     <div><span>Fill</span><span>Blue 600 · hover Blue 700</span></div><div><span>Label</span><span>Label / 15 semibold, white</span></div></div></section>
   <section><h2>Usage</h2><div class="usage"><div><h3 style="color:var(--ok)">Use</h3><ul>${g.use.map((u,i)=>`<li class="${i?'new':''}">${u}</li>`).join('')}</ul></div><div><h3 style="color:var(--ink-2)">Avoid</h3><ul>${g.avoid.map(u=>`<li>${u}</li>`).join('')}</ul></div></div></section>
   <section><h2>Why it looks like this</h2><p class="sec-sub">Decisions about this component, newest first.</p><div class="reasons">
     ${L.reasons.slice().reverse().map(r=>`<div class="reason mine"><span class="when">Today · ${r.where}${r.challenged?' · you disagreed with the assistant':''}</span><p>${r.text}</p><button class="linkish ch" data-review="${r.from}">Change this decision</button></div>`).join('')}
     <div class="reason"><span class="when">March 2024</span><p>One filled blue action per screen. Corners moved from 4px to 6px in the 2024 refresh.</p></div></div></section>
   <section><h2>Where it’s used</h2><div class="where"><span>Trip<em>41 screens</em></span><span>Account<em>29</em></span><span>Search<em>6${S.dec.search&&!OUT.search[S.dec.search.k].open?' · '+(S.dec.search.k==='variant'?'Large':S.dec.search.k==='align'?'fix pending':'adapted'):' · unreviewed'}</em></span><span>Checkout<em>12${S.dec.checkout&&!OUT.checkout[S.dec.checkout.k].open?' · '+(S.dec.checkout.k==='align'?'fix pending':S.dec.checkout.k==='separate'?'Payment action':'4px corners'):' · unreviewed'}</em></span></div></section>`;
}

function simplePage(p){
  if(p==='colour')return `<header><div class="eyebrow">Foundation</div><h1>Colour</h1></header><div class="sw">${[['#2563EB','Blue 600'],['#1D4FD7','Blue 700'],['#1A1C1E','Ink'],['#F2F3F1','Surface']].map(([c,n])=>`<div><i style="background:${c}"></i><span>${n}</span></div>`).join('')}</div>`;
  if(p==='type')return `<header><div class="eyebrow">Foundation</div><h1>Typography</h1></header><div class="simple"><div style="font:700 32px var(--f-ui)">Display 32</div><div style="font:400 16px var(--f-ui)">Body 16 · Plan trips with people you like.</div><div style="font:600 15px var(--f-ui)">Label 15 semibold</div></div>`;
  if(p==='secondary')return `<header><div class="eyebrow">Component</div><h1>Secondary action</h1><p class="purpose">Offers an alternative to the main task.</p><div class="status"><span><i style="background:var(--ok)"></i>Approved · shipped</span><span>Nothing new in the product</span></div></header><div class="stage"><span class="pbtn" style="height:40px;border-radius:6px;padding:0 18px;font-size:14px;background:#fff;color:${BLUE};box-shadow:inset 0 0 0 1.5px ${BLUE}">Edit trip</span></div>`;
  if(p==='field')return `<header><div class="eyebrow">Component</div><h1>Text field</h1><p class="purpose">Collects a short piece of text.</p><div class="status"><span><i style="background:var(--ok)"></i>Approved · shipped</span></div></header><div class="stage"><span style="width:240px;height:40px;border:1px solid #C9CFD6;border-radius:6px;background:#fff;color:#7B8188;display:flex;align-items:center;padding:0 12px;font-size:14px">Where to?</span></div>`;
  if(p==='payment')return `<header><div class="eyebrow">Component · new today</div><h1>Payment action</h1><p class="purpose">Takes payment at the end of checkout.</p><div class="status"><span><i style="background:var(--ok)"></i>Approved today · matches what’s shipped</span></div></header><div class="stage">${btn('Pay £412',40,4)}</div><section><h2>Why it exists</h2><div class="reasons"><div class="reason mine"><span class="when">Today · split from Primary action</span><p>${OUT.checkout.separate.why}</p><button class="linkish ch" data-goto="checkout">Change this decision</button></div></div></section>`;
}

function render(){
  renderNav();
  const m=document.getElementById('main');
  m.innerHTML=S.page==='primary'?primaryPage():simplePage(S.page);
  m.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{const id=b.dataset.review;S.open=S.open===id&&b.classList.contains('ghost')?null:id;S.showAlt=!!(S.dec[id]&&OUT[id][S.dec[id].k].alt);S.overlay=false;S.fresh=null;render();const r=document.querySelector('.review');if(r)r.scrollIntoView({behavior:'smooth',block:'nearest'})});
  m.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{S.page='primary';S.open=b.dataset.goto;S.showAlt=true;render()});
  m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>decide(S.open,b.dataset.k));
  const n=document.getElementById('notq');if(n)n.onclick=()=>{S.showAlt=true;render()};
  const c=document.getElementById('closeR');if(c)c.onclick=()=>{S.open=null;render()};
  const o=document.getElementById('ovl');if(o)o.onclick=()=>{S.overlay=!S.overlay;render()};
}
function decide(id,k){
  const prev=S.dec[id];const f=FINDINGS[id];
  S.dec[id]={k,challenged:k!==f.guess&&k!=='unsure'};S.open=null;S.showAlt=false;S.fresh=id;
  if(id==='checkout'&&k==='separate'){toast('Payment action added to the library.',()=>{prev?S.dec[id]=prev:delete S.dec[id];S.fresh=null;render()});render();return}
  toast(OUT[id][k].result,()=>{prev?S.dec[id]=prev:delete S.dec[id];S.fresh=null;render()});
  render();
}
let tt,undoFn;
function toast(m,fn){const t=document.getElementById('toast');document.getElementById('tmsg').textContent=m;undoFn=fn;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),5000)}
document.getElementById('tundo').onclick=()=>{undoFn&&undoFn();document.getElementById('toast').classList.remove('show')};
render();
</script>
